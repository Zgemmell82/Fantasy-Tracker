<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1119">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantasy">
  <link rel="icon" href="icon-v2.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
  <script>
    // The 1:00 game (light) or the night game (dark, the default), as chosen on this device.
    try { if (localStorage.getItem('ff-theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f1f3f8'; } } catch (e) {}
  </script>
  <title>Fantasy Tracker</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
