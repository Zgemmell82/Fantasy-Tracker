<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Survivor VR - Phone</title>
<link rel="stylesheet" href="/src/shared/theme.css" />
<style>
  body { min-height: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 520px; margin: 0 auto; padding: 14px 14px 90px; display:flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  header { display:flex; align-items:center; justify-content: space-between; gap: 8px; }
  header .me { display:flex; align-items:center; gap:8px; font-weight: 700; }
  .card { background: var(--card); border: 2px solid #3f6b52; border-radius: var(--radius); padding: 16px; }
  .center { text-align:center; }
  h2 { font-size: 24px; } .muted { color: var(--muted); }
  input[type=text], textarea { width:100%; font: inherit; color: var(--ink); background: #0f1f17; border: 2px solid #3f6b52; border-radius: 12px; padding: 12px; }
  textarea { min-height: 96px; resize: none; }
  .btn { width:100%; background: var(--fire); color: #2b1606; border:0; border-radius: 14px; padding: 16px; font-size: 20px; font-weight: 800; }
  .btn[disabled] { opacity:.35; }
  .big2 { display:grid; grid-template-columns: 1fr; gap: 14px; }
  .tap { height: 24vh; min-height: 130px; font-size: 32px; border-radius: 22px; border: 0; font-weight: 900; color: #fff; box-shadow: 0 8px 0 #0006; }
  .tap:active:not([disabled]) { transform: translateY(6px); box-shadow: 0 2px 0 #0006; }
  .tap.help { background: var(--help); } .tap.sabotage { background: var(--sab); }
  .tap.picked { outline: 6px solid var(--fire2); opacity: 1 !important; }
  .tap[disabled]:not(.picked) { opacity: .25; }
  .opt { display:flex; align-items:center; gap: 10px; padding: 12px; border: 2px solid #3f6b52; border-radius: 12px; margin-bottom: 8px; font-size: 18px; }
  .opt.sel { border-color: var(--fire2); background: #35604a; }
  .opt.imm { opacity:.4; }
  .row { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
  .pill { background:#0f1f17; border-radius: 99px; padding: 3px 10px; font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #000d; padding: 10px 16px; border-radius: 99px; display:none; z-index: 20; max-width: 90vw; text-align: center; }
  #dbgbtn { position: fixed; right: 10px; bottom: 10px; width: 52px; height: 52px; border-radius: 50%; border: 0; background:#35604a; font-size: 24px; z-index: 30; }
  #dbg { position: fixed; left:0; right:0; bottom:0; background: #0b1912f2; border-top: 2px solid var(--fire); padding: 12px 14px 74px; z-index: 25; display:none; max-height: 60vh; overflow:auto; }
  #dbg select { font: inherit; background:#0f1f17; color: var(--ink); border: 2px solid #3f6b52; border-radius: 10px; padding: 8px; }
  #dbg .btn { font-size: 14px; padding: 8px; width:auto; }
  .count { font-size: 12px; color: var(--muted); text-align: right; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<button id="dbgbtn" title="Debug panel">⚙</button>
<div id="dbg"></div>
<script type="module" src="/src/phone/main.js"></script>
</body>
</html>
