<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survivor VR - Host</title>
<link rel="stylesheet" href="/src/shared/theme.css" />
<style>
  #stage { position: fixed; inset: 0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #panel { position: fixed; left: 10px; top: 10px; bottom: 10px; width: 350px; overflow-y: auto; background: rgba(18,38,28,.93);
    border: 2px solid #3f6b52; border-radius: var(--radius); padding: 12px; font-size: 14px; z-index: 5; }
  #panel.collapsed { width: auto; bottom: auto; }
  #panel.collapsed > :not(#ptop) { display: none; }
  #ptop { display:flex; justify-content: space-between; align-items:center; gap:8px; }
  #panel h3 { font-size: 13px; text-transform: uppercase; color: var(--sand); margin: 14px 0 6px; letter-spacing:.08em; }
  .btn { background: var(--fire); color:#2b1606; border:0; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
  .btn.alt { background: #35604a; color: var(--ink); }
  .btn.sm { padding: 4px 8px; font-size: 12px; }
  .btn[disabled] { opacity:.4; cursor: not-allowed; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap: wrap; margin: 4px 0; }
  .cards { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .card { background: var(--card); border:2px solid #3f6b52; border-radius: 12px; padding: 8px; text-align:left; }
  .card:hover:not([disabled]) { border-color: var(--fire2); }
  .card b { display:block; } .card small { color: var(--muted); }
  .muted { color: var(--muted); } .pill { background:#0f1f17; border-radius: 99px; padding: 2px 8px; font-size:12px; }
  #bigmsg { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(18,38,28,.85); padding: 8px 18px; border-radius: 99px; z-index: 4; font-size: 18px; pointer-events:none; }
  #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 99px; z-index:4; font-size: 14px; pointer-events:none; }
  #vrbtn { position: fixed; right: 12px; top: 12px; z-index: 6; display:none; }
  #cd { position: fixed; inset:0; display:none; align-items:center; justify-content:center; font-size: 180px; font-weight: 900; color: var(--fire2); text-shadow: 0 6px 30px #000; pointer-events:none; z-index: 3; }
  .links a { color: var(--fire2); word-break: break-all; }
  details summary { cursor:pointer; color: var(--sand); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cd"></div>
<div id="bigmsg"></div>
<div id="help"></div>
<button id="vrbtn" class="btn">ENTER VR</button>
<div id="panel">
  <div id="ptop"><h2>🌴 Survivor VR — Host</h2><button class="btn alt sm" id="collapse">_</button></div>
  <div id="status" class="muted"></div>
  <h3>Players</h3><div id="players"></div>
  <div id="flow"></div>
  <h3>Links</h3><div id="links" class="links muted"></div>
  <details id="debugbox" open><summary>Debug panel (fake phone players)</summary><div id="debug"></div></details>
</div>
<script type="module" src="/src/host/main.js"></script>
</body>
</html>
